<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>dc-example</title>
    <script src="/libs/dc-sdk/dc.min.js"></script>
    <link href="/libs/dc-sdk/dc.min.css" type="text/css" rel="stylesheet" />
    <link href="../index.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="viewer-container" class="viewer-container"></div>
    <script>
      DC.config.baseUrl = '../libs/dc-sdk/resources/'
      let viewer = new DC.Viewer('viewer-container')
      let baseLayer = DC.ImageryLayerFactory.createImageryLayer(
        DC.ImageryType.AMAP,
        {
          style: 'img',
          crs: 'WGS84',
        }
      )
      viewer.addBaseLayer(baseLayer)
      let layer = new DC.VectorLayer('layer')
      viewer.addLayer(layer)

      let polyline = new DC.Polyline('-75, 35; -125, 35')
      polyline.setStyle({
        width: 10,
        material: DC.Color.RED,
        clampToGround: true,
      })
      layer.addOverlay(polyline)

      // ===== 动态坐标模式（高频更新防闪动）=====
      // 每秒 10 次重设末端坐标，模拟「实时连线」；
      // dynamicPositions: true 走顶点缓冲原地更新，
      // 避免静态几何每次重赋值触发「图元移除 → 异步重建」的闪动
      // （动态模式默认 arcType = ArcType.NONE，跳过逐帧大地线加密）
      let liveLine = new DC.Polyline(
        [
          [-100, 30, 0],
          [-100.5, 30.5, 0],
        ],
        { dynamicPositions: true }
      )
      liveLine.setStyle({
        width: 5,
        material: DC.Color.YELLOW,
      })
      layer.addOverlay(liveLine)

      let angle = 0
      setInterval(() => {
        angle += 0.05
        liveLine.positions = [
          [-100, 30, 0],
          [-100.5 + Math.sin(angle) * 0.4, 30.5 + Math.cos(angle) * 0.4, 0],
        ]
      }, 100)

      viewer.flyTo(layer)
    </script>
  </body>
</html>
